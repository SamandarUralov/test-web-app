<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in</title>
  <style>
    :root { color-scheme: light; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: linear-gradient(135deg, #eef2ff, #f8fafc); color: #172033; }
    .card { width: min(100% - 2rem, 400px); padding: 2.5rem; background: #fff; border: 1px solid #e5e7eb; border-radius: 20px; box-shadow: 0 20px 50px rgba(15, 23, 42, .10); }
    h1 { margin: 0 0 .5rem; font-size: 1.8rem; }
    .subtitle { margin: 0 0 2rem; color: #64748b; }
    label { display: block; margin: 1rem 0 .45rem; font-size: .9rem; font-weight: 600; }
    input { width: 100%; padding: .8rem .9rem; border: 1px solid #cbd5e1; border-radius: 10px; font: inherit; outline: none; }
    input:focus { border-color: #6366f1; box-shadow: 0 0 0 3px #c7d2fe; }
    button { width: 100%; margin-top: 1.5rem; padding: .85rem; border: 0; border-radius: 10px; background: #4f46e5; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    button:hover { background: #4338ca; }
    #message { min-height: 1.4em; margin: 1rem 0 0; text-align: center; color: #4f46e5; font-size: .9rem; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to continue to your account.</p>
    <form id="login-form">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
      <button type="submit">Sign in</button>
      <p id="message" role="status"></p>
    </form>
  </main>
  <script>
    document.querySelector('#login-form').addEventListener('submit', function (event) {
      event.preventDefault();
      document.querySelector('#message').textContent = 'Demo login submitted.';
    });
  </script>
</body>
</html>
